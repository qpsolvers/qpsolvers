name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

jobs:
    check-secrets:
        name: "Check availability of GitHub secrets"
        runs-on: ubuntu-latest
        outputs:
            has-secrets: ${{ steps.secret-check.outputs.available }}
        steps:
          - name: Check whether GitHub secrets are available
            id: secret-check
            shell: bash
            run: |
                if [ '${{ secrets.MSK_LICENSE }}' != '' ]; then
                    echo "available=true" >> ${GITHUB_OUTPUT};
                else
                    echo "available=false" >> ${GITHUB_OUTPUT};
                fi

    coverage:
        name: "Coverage"
        runs-on: ubuntu-latest
        needs: [check-secrets]
        if: needs.check-secrets.outputs.has-secrets == 'true'

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v6

            - name: "Setup Pixi"
              uses: prefix-dev/setup-pixi@v0.9.5
              with:
                  pixi-version: v0.68.1
                  cache: true

            - name: "Prepare license files"
              env:
                  MSK_LICENSE: ${{ secrets.MSK_LICENSE }}
              run: |
                  echo "${MSK_LICENSE}" > ${{ github.workspace }}/mosek.lic

            - name: "Check code coverage"
              env:
                  MOSEKLM_LICENSE_FILE: ${{ github.workspace }}/mosek.lic
              run: |
                  pixi run coverage

            - name: "Upload coverage results"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  pixi run coveralls

    licensed:
        name: "Test licensed solvers on ${{ matrix.os }}"
        runs-on: ${{ matrix.os }}
        needs: [check-secrets]
        if: needs.check-secrets.outputs.has-secrets == 'true'

        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v6

            - name: "Setup Pixi"
              uses: prefix-dev/setup-pixi@v0.9.5
              with:
                  pixi-version: v0.68.1
                  environments: licensed
                  cache: true

            - name: "Prepare license files"
              env:
                  MSK_LICENSE: ${{ secrets.MSK_LICENSE }}
              run: |
                  echo "${MSK_LICENSE}" > ${{ github.workspace }}/mosek.lic

            - name: "Test licensed solvers"
              env:
                  MOSEKLM_LICENSE_FILE: ${{ github.workspace }}/mosek.lic
              run: |
                  pixi run -e licensed licensed

    lint:
        name: "Code style"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v6

            - name: "Setup Pixi"
              uses: prefix-dev/setup-pixi@v0.9.5
              with:
                  pixi-version: v0.68.1
                  environments: lint
                  cache: true

            - name: "Lint qpsolvers"
              run: |
                  pixi run lint

    test:
        name: "Test ${{ matrix.os }} with ${{ matrix.pyenv }}"
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                pyenv: [py310, py311, py312, py313]

        env:
            PIXI_ENV: test-${{ matrix.pyenv }}

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v6

            - name: "Setup Pixi"
              uses: prefix-dev/setup-pixi@v0.9.5
              with:
                  pixi-version: v0.68.1
                  environments: ${{ env.PIXI_ENV }}
                  cache: true

            - name: "Run unit tests"
              run: |
                  pixi run --environment ${{ env.PIXI_ENV }} test

    pdhcg:
        name: "PDHCG CPU / Python ${{ matrix.python-version }}"
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.10', '3.12']
        env:
            CMAKE_BUILD_PARALLEL_LEVEL: 2
            OMP_NUM_THREADS: 2
            OPENBLAS_NUM_THREADS: 1
            MKL_NUM_THREADS: 1
        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v6
            - name: "Setup Python"
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
            - name: "Install CPU dependencies"
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential cmake ninja-build libopenblas-dev liblapack-dev zlib1g-dev
                  python -m pip install --upgrade pip
            - name: "Build PDHCG CPU backend"
              run: >-
                  python -m pip install --no-binary=pdhcg
                  -Ccmake.define.PDHCG_DEVICES=CPU
                  'pdhcg==0.4.0'
            - name: "Install qpsolvers and test dependencies"
              run: python -m pip install '.[pdhcg,daqp]' 'coverage[toml]'
            - name: "Verify CPU backend registration"
              run: |
                  python -c "import pdhcg, qpsolvers; assert pdhcg.built_devices() == ('cpu',); assert 'pdhcg' in qpsolvers.available_solvers"
            - name: "Run regression tests and PDHCG coverage"
              run: |
                  coverage run --rcfile=/dev/null --source=qpsolvers -m unittest discover -v
                  coverage report --rcfile=/dev/null --include='*/qpsolvers/solvers/pdhcg_.py'

    ci_success:
        name: "CI success"
        runs-on: ubuntu-latest
        needs: [coverage, licensed, lint, test, pdhcg]
        steps:
            - run: echo "CI workflow completed successfully"
